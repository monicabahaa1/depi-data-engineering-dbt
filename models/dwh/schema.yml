
version: 2

models:
  - name: DIMCountry
    description: >
      Country dimension containing distinct countries
      from the staging layer.
    columns:
      - name: country_id
        description: Unique identifier assigned to each country.
        data_tests:
          - unique
          - not_null
      - name: country
        description: Country name.
        data_tests:
          - not_null

  - name: DIMDepartement
    description: >
      Department dimension containing distinct departments
      from the staging layer.
    columns:
      - name: department_id
        description: Unique identifier assigned to each department.
        data_tests:
          - unique
          - not_null
      - name: department_name
        description: Department name.
        data_tests:
          - not_null

  - name: DIMGender
    description: >
      Gender dimension containing distinct gender values
      from the staging layer.
    columns:
      - name: gender_id
        description: Unique identifier assigned to each gender.
        data_tests:
          - unique
          - not_null
      - name: gender_name
        description: Gender value.
        data_tests:
          - not_null

  - name: DIMDate
    description: >
      Date dimension containing calendar attributes derived
      from employee dates of birth.
    columns:
      - name: date_key
        description: Integer date key formatted as YYYYMMDD.
        data_tests:
          - unique
          - not_null
      - name: date
        description: Calendar date derived from employee DOB.
        data_tests:
          - unique
          - not_null
      - name: year
        description: Four-digit year.
        data_tests:
          - not_null
      - name: month
        description: Numeric month from 1 to 12.
        data_tests:
          - not_null
      - name: day
        description: Day of the month.
        data_tests:
          - not_null
      - name: month_name
        description: Full month name.
      - name: day_name
        description: Weekday name.

  - name: DIMEmployee
    description: >
      Employee dimension containing cleaned descriptive attributes
      from the staging layer.
    columns:
      - name: employee_id
        description: Unique identifier for each employee.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Employee first name.
        data_tests:
          - not_null
      - name: last_name
        description: Employee last name.
        data_tests:
          - not_null
      - name: email
        description: Employee email address.
      - name: gender
        description: Employee gender.
      - name: DOB
        description: Employee date of birth.
      - name: salary
        description: Employee salary; may be null.
      - name: department
        description: Employee department.
      - name: country
        description: Employee country.

  - name: FACTEmployee
    description: >
      Employee fact model built from the staging OBT,
      containing employee attributes for analysis.
    columns:
      - name: employee_id
        description: Employee identifier at the grain of one row per employee.
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: Employee full name generated by the capitalize_name macro.
        data_tests:
          - not_null
      - name: email
        description: Employee email address.
      - name: gender
        description: Employee gender.
      - name: DOB
        description: Employee date of birth.
      - name: salary
        description: Employee salary; may be null.
      - name: department
        description: Employee department.
      - name: country
        description: Employee country.
