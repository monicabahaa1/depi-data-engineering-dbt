
version: 2

models:
  - name: STGEmployee
    description: >
      Staging model that cleans and standardizes employee data
      from the raw source before it is used in the Data Warehouse.
    columns:
      - name: employee_id
        description: Unique identifier for each employee.
        data_tests:
          - not_null
          - unique
      - name: first_name
        description: Employee first name.
      - name: last_name
        description: Employee last name.
      - name: email
        description: Normalized employee email address.
      - name: gender
        description: Standardized employee gender.
      - name: DOB
        description: Employee date of birth converted to a date.
      - name: salary
        description: Employee salary; may be null if missing or invalid.
      - name: department
        description: Trimmed employee department.
      - name: country
        description: Trimmed employee country.

  - name: STG_DIMCountry
    description: Distinct, non-empty country values from STGEmployee.
    columns:
      - name: country
        description: Country name.
        data_tests:
          - unique
          - not_null

  - name: STG_DIMGender
    description: Distinct, non-empty gender values from STGEmployee.
    columns:
      - name: gender
        description: Standardized gender value.
        data_tests:
          - unique
          - not_null

  - name: STG_DIMDepartement
    description: Distinct, non-empty department values from STGEmployee.
    columns:
      - name: department
        description: Department name.
        data_tests:
          - unique
          - not_null

  - name: STG_DIMDate
    description: Distinct employee dates of birth from STGEmployee.
    columns:
      - name: date
        description: Employee date of birth.
        data_tests:
          - unique
          - not_null

  - name: STG_DIMEmployee
    description: Employee attributes selected from the cleaned staging model.
    columns:
      - name: employee_id
        description: Employee identifier.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Employee first name.
      - name: last_name
        description: Employee last name.
      - name: email
        description: Employee email.
      - name: gender
        description: Employee gender.
      - name: DOB
        description: Employee date of birth.
      - name: salary
        description: Employee salary; may be null.
      - name: department
        description: Employee department.
      - name: country
        description: Employee country.

  - name: STG_OBT
    description: >
      Staging model combining cleaned employee attributes and
      a full name generated by the capitalize_name macro.
    columns:
      - name: employee_id
        description: Employee identifier.
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: Employee full name generated by the custom macro.
        data_tests:
          - not_null
      - name: first_name
        description: Employee first name.
      - name: last_name
        description: Employee last name.
      - name: email
        description: Employee email.
      - name: gender
        description: Employee gender.
      - name: DOB
        description: Employee date of birth.
      - name: salary
        description: Employee salary; may be null.
      - name: department
        description: Employee department.
      - name: country
        description: Employee country.
